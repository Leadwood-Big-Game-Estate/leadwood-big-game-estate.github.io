<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Leadwood Tracker</title>
<meta name="description" content="Signalement des animaux en temps réel sur la carte de la réserve.">
<meta name="theme-color" content="#1D9E75">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leadwood">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* =================================================================== *
 *  Leadwood Tracker
 * =================================================================== */
:root{
  --sand:#F2EEE4;
  --surface:#FFFFFF;
  --surface-2:#E9E4D6;
  --ink:#22201A;
  --ink-soft:#57513F;
  --ink-mute:#847C66;
  --line:#DDD6C4;
  --green:#1D9E75;
  --green-deep:#15795A;
  --ochre:#C8842B;
  --clay:#B4553A;
  --sky:#378ADD;
  --shadow:0 2px 6px rgba(34,32,26,.09), 0 12px 28px rgba(34,32,26,.11);
  --shadow-sm:0 1px 3px rgba(34,32,26,.14);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --f-ui:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --f-dis:"Zilla Slab",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sand:#14150F; --surface:#1D1F17; --surface-2:#282A20;
    --ink:#EDEADF; --ink-soft:#BCB6A3; --ink-mute:#8D8772; --line:#383A2D;
    --green:#2FBF8E; --green-deep:#1D9E75; --ochre:#DCA04A; --clay:#D27053; --sky:#58A0EE;
    --shadow:0 2px 6px rgba(0,0,0,.45), 0 12px 28px rgba(0,0,0,.5);
    --shadow-sm:0 1px 3px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sand:#14150F; --surface:#1D1F17; --surface-2:#282A20;
  --ink:#EDEADF; --ink-soft:#BCB6A3; --ink-mute:#8D8772; --line:#383A2D;
  --green:#2FBF8E; --green-deep:#1D9E75; --ochre:#DCA04A; --clay:#D27053; --sky:#58A0EE;
  --shadow:0 2px 6px rgba(0,0,0,.45), 0 12px 28px rgba(0,0,0,.5);
  --shadow-sm:0 1px 3px rgba(0,0,0,.55);
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--f-ui);font-size:15px;line-height:1.45;
  color:var(--ink);background:var(--sand);
  overflow:hidden;overscroll-behavior:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:5px}
[hidden]{display:none!important}
#app{display:flex;flex-direction:column;height:100dvh}

/* ------------------------- Écran d'accès --------------------------- */
#gate,#login{
  position:fixed;inset:0;z-index:2000;background:var(--sand);
  display:grid;place-items:center;padding:24px;
  padding-top:calc(var(--safe-t) + 24px);padding-bottom:calc(var(--safe-b) + 24px);
}
.gate-box{width:100%;max-width:330px;text-align:center;display:grid;gap:11px}
.gate-box .mark{
  width:58px;height:58px;border-radius:17px;background:var(--green);
  display:grid;place-items:center;margin:0 auto 4px;box-shadow:var(--shadow-sm);
}
.gate-box .mark svg{width:33px;height:33px;fill:#fff}
.gate-box h1{font-family:var(--f-dis);font-size:25px;font-weight:700;letter-spacing:-.015em}
.gate-box .sub{font-size:13px;color:var(--ink-mute);margin-bottom:6px}
.gate-box .err{font-size:13px;font-weight:600;color:var(--clay)}
.gate-box .link{font-size:13px;font-weight:600;color:var(--ink-mute);padding:8px;text-decoration:underline}
.gate-box .note{font-size:12.5px;color:var(--ink-mute);line-height:1.45}
select.inp{
  appearance:none;-webkit-appearance:none;text-align:center;text-align-last:center;
  font-weight:600;background-image:none;cursor:pointer;
}
#login{z-index:1900}

.hint{font-size:12.5px;color:var(--ink-mute);line-height:1.5;margin-top:10px}
.inp{
  width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface-2);font-size:14px;
}
.inp:focus{outline:none;border-color:var(--green)}
.hint strong{color:var(--ink-soft)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.45;margin-top:10px;padding:9px 11px;border-radius:10px}
.check.ok{background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green-deep)}
.check.warn{background:color-mix(in srgb,var(--ochre) 16%,transparent);color:var(--ochre)}
:root[data-theme="dark"] .check.ok,:root:not([data-theme="light"]) .check.ok{color:var(--green)}
.btn{
  width:100%;min-height:52px;border-radius:14px;background:var(--green);color:#fff;
  font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 4px 14px rgba(29,158,117,.32);
}
.btn:active{background:var(--green-deep)}
.btn:disabled{background:var(--surface-2);color:var(--ink-mute);box-shadow:none;cursor:default}
.btn-ghost{
  min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);font-weight:600;color:var(--ink-soft);
}

/* ------------------------------ Carte ------------------------------ */
#screen{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{
  display:flex;align-items:center;gap:8px;flex-shrink:0;
  padding:calc(var(--safe-t) + 9px) 12px 9px;
  background:var(--surface);border-bottom:1px solid var(--line);
}
#topbar .name{font-family:var(--f-dis);font-size:16px;font-weight:700;letter-spacing:-.01em}
.badge{
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
}
.badge .led{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{color:var(--green-deep);border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent)}
.badge.searching{color:var(--ochre);border-color:var(--ochre);background:color-mix(in srgb,var(--ochre) 14%,transparent)}
.badge.error,.badge.out{color:var(--clay);border-color:var(--clay);background:color-mix(in srgb,var(--clay) 13%,transparent)}
.badge.local{color:var(--ink-mute);border-color:var(--line);background:var(--surface-2)}
.badge.wait{color:var(--ochre);border-color:var(--ochre);background:color-mix(in srgb,var(--ochre) 14%,transparent)}
#topbar .name{flex:0 0 auto}
#sync{cursor:pointer}
:root[data-theme="dark"] .badge.ok,:root:not([data-theme="light"]) .badge.ok{color:var(--green)}
#topbar .sp{flex:1}
.tb-btn{
  width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);
  display:grid;place-items:center;color:var(--ink-soft);position:relative;
}
.tb-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tb-btn.on{background:var(--green);color:#fff;border-color:transparent}
.tb-btn .n{
  position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--clay);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;
  font-variant-numeric:tabular-nums;
}

#maparea{flex:1;position:relative;overflow:hidden;background:var(--surface-2)}
#map{position:absolute;inset:0;z-index:0;background:#CFC8B2}
#map.plan{background:#EEE8D6}
:root[data-theme="dark"] #map.plan{background:#22251C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #map.plan{background:#22251C}}
#map.leaflet-container{font-family:var(--f-ui);outline:0}
#map .leaflet-control-attribution{font-size:9px;line-height:1.3;background:rgba(255,255,255,.72);color:#333;padding:1px 5px;border-radius:5px 0 0 0}
#map .leaflet-control-attribution a{color:#333}
#map .leaflet-control-scale-line{
  font-size:10.5px;font-weight:700;border-color:var(--ink-soft);color:var(--ink-soft);
  background:color-mix(in srgb,var(--surface) 82%,transparent);
}
#map .leaflet-bottom.leaflet-left{margin-bottom:4px}
.pin{background:none;border:0}
.pin svg{display:block;overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.me{background:none;border:0;pointer-events:none}
.me i{position:absolute;border-radius:50%;display:block}
.me .halo{inset:0;background:#378ADD;opacity:.22}
.me .dot{left:10px;top:10px;width:14px;height:14px;background:#378ADD;border:2.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.lbl{background:none;border:0;pointer-events:none}
.lbl span{
  position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;
  font-size:10.5px;font-weight:700;letter-spacing:.01em;color:#fff;
  text-shadow:0 0 3px #000,0 0 2px #000,0 0 1px #000;
}
.lbl.eau span{color:#BFE3FF}
.plan .lbl span{color:#5A4526;text-shadow:0 0 3px #EEE8D6,0 0 2px #EEE8D6,0 0 1px #EEE8D6}
.plan .lbl.eau span{color:#1F6FB8}
:root[data-theme="dark"] .plan .lbl span{color:#E6D3AE;text-shadow:0 0 3px #22251C,0 0 2px #22251C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .plan .lbl span{color:#E6D3AE;text-shadow:0 0 3px #22251C,0 0 2px #22251C}}
.me .halo{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.22}50%{opacity:.07}}
@media (prefers-reduced-motion:reduce){.me .halo{animation:none}}
#loading{
  position:absolute;inset:0;background:color-mix(in srgb,var(--sand) 88%,transparent);
  display:grid;place-items:center;z-index:5;gap:10px;
}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.map-tools{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:7px;z-index:4}
.map-tools button{
  width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow-sm);display:grid;place-items:center;color:var(--ink-soft);font-weight:700;font-size:17px;
}
.map-tools button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.map-tools button.on{color:var(--green);border-color:var(--green)}
.scalebar{
  position:absolute;left:10px;bottom:12px;z-index:4;font-size:10.5px;font-weight:700;
  color:var(--ink-soft);background:color-mix(in srgb,var(--surface) 82%,transparent);
  padding:3px 7px;border-radius:7px;border:1px solid var(--line);
  font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;
}
.scalebar i{display:block;height:6px;border:1px solid currentColor;border-top:0}

/* ------------------------- Panneau du bas -------------------------- */
#panel{
  background:var(--surface);border-top:1px solid var(--line);flex-shrink:0;
  padding:10px 12px calc(var(--safe-b) + 12px);
}
#grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(63px,1fr));gap:6px;
  max-height:172px;overflow-y:auto;margin-bottom:10px;
}
.an{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 3px 7px;
  border:2px solid var(--line);border-radius:11px;background:var(--surface-2);
  min-width:0;transition:transform .08s;
}
.an:active{transform:scale(.94)}
.an .e{font-size:21px;line-height:1}
.an .n{
  font-size:9.5px;font-weight:600;color:var(--ink-mute);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;
}
.an[aria-pressed="true"]{border-color:var(--c,#1D9E75);background:color-mix(in srgb,var(--c,#1D9E75) 14%,var(--surface))}
.an[aria-pressed="true"] .n{color:var(--ink)}

/* ------------------------------ Cartes ----------------------------- */
#popup{
  position:absolute;left:10px;right:10px;bottom:10px;z-index:6;
  background:var(--surface);border:1px solid var(--line);border-radius:15px;
  box-shadow:var(--shadow);padding:13px 14px;display:flex;gap:12px;align-items:flex-start;
}
#popup .e{font-size:26px;line-height:1;flex:0 0 auto}
#popup .m{flex:1;min-width:0}
#popup h4{font-family:var(--f-dis);font-size:17px;font-weight:700;line-height:1.15}
#popup .sub{font-size:12.5px;color:var(--ink-mute);font-variant-numeric:tabular-nums;margin-top:2px}
#popup .acts{display:flex;gap:14px;margin-top:8px}
#popup .acts button{font-size:13px;font-weight:700;color:var(--green)}
#popup .acts button.del{color:var(--clay)}
#popup .x{align-self:flex-start;color:var(--ink-mute);font-size:19px;line-height:1;padding:2px 4px}

/* ----------------------------- Placement --------------------------- */
#crosshair{position:absolute;inset:0;display:grid;place-items:center;z-index:5;pointer-events:none}
#crosshair .c{width:54px;height:54px;border-radius:50%;border:2px solid var(--green);position:relative;background:color-mix(in srgb,var(--green) 12%,transparent)}
#crosshair .c::before,#crosshair .c::after{content:"";position:absolute;background:var(--green)}
#crosshair .c::before{left:50%;top:-11px;bottom:-11px;width:2px;transform:translateX(-1px)}
#crosshair .c::after{top:50%;left:-11px;right:-11px;height:2px;transform:translateY(-1px)}
#placebar{
  position:absolute;left:10px;right:10px;top:10px;z-index:6;background:var(--ink);color:var(--sand);
  border-radius:13px;padding:11px 13px;display:flex;align-items:center;gap:11px;box-shadow:var(--shadow);
}
#placebar p{font-size:13px;font-weight:600;line-height:1.3;flex:1}
#placebar button{padding:8px 13px;border-radius:10px;font-size:13px;font-weight:700;flex:0 0 auto}
#placebar .go{background:var(--sand);color:var(--ink)}
#placebar .no{color:var(--sand);opacity:.75}

/* ------------------------------ Sheet ------------------------------ */
#scrim{position:fixed;inset:0;z-index:900;background:rgba(10,12,8,.45);opacity:0;transition:opacity .22s}
#scrim.open{opacity:1}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--surface);
  border-radius:20px 20px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.24);
  max-height:88dvh;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .28s cubic-bezier(.22,.8,.3,1);
  padding-bottom:var(--safe-b);
}
#sheet.open{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
.grip{padding:10px 0 4px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grip i{width:40px;height:4px;border-radius:2px;background:var(--line);display:block}
.shead{padding:2px 18px 12px;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line)}
.shead h2{font-family:var(--f-dis);font-size:20px;font-weight:700;letter-spacing:-.01em}
.shead .r{margin-left:auto;font-size:12px;color:var(--ink-mute)}
.sbody{overflow-y:auto;overflow-x:hidden;padding:16px 18px 20px;display:grid;gap:18px}
.field{display:grid;gap:8px}
.label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sand)}
.pos-card{
  display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--line);
}
.pos-card .coords{font-size:14.5px;font-weight:700}
.pos-card .acc{font-size:12.5px;color:var(--ink-mute);margin-top:1px}
.pos-card button{margin-left:auto;font-size:13px;font-weight:700;color:var(--green-deep);padding:6px 8px;flex:0 0 auto}
:root[data-theme="dark"] .pos-card button,
:root:not([data-theme="light"]) .pos-card button{color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{padding:12px;border-radius:12px;background:var(--surface-2)}
.stat .v{font-family:var(--f-dis);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.stat .k{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute);margin-top:4px}
.rows{display:grid}
.row-i{display:flex;gap:11px;align-items:center;padding:11px 3px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row-i:last-child{border-bottom:0}
.row-i .e{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:0 0 auto;background:color-mix(in srgb,var(--c,#1D9E75) 15%,transparent)}
.row-i .m{flex:1;min-width:0}
.row-i .t{font-weight:700;font-size:14.5px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.row-i .s{display:block;font-size:12.5px;color:var(--ink-mute);font-variant-numeric:tabular-nums;margin-top:1px}
.pill{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-mute)}
.pill.live{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green-deep)}
:root[data-theme="dark"] .pill.live,:root:not([data-theme="light"]) .pill.live{color:var(--green)}
.menu{display:grid}
.menu button{display:flex;align-items:center;gap:12px;padding:13px 3px;width:100%;text-align:left;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:600}
.menu button:last-child{border-bottom:0}
.menu svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;color:var(--ink-mute);flex:0 0 auto}
.menu .sub{margin-left:auto;font-size:12px;font-weight:500;color:var(--ink-mute)}
.menu button.danger{color:var(--clay)}
.about{font-size:12.5px;color:var(--ink-mute);line-height:1.5}
.empty{text-align:center;padding:30px 12px;color:var(--ink-mute)}
.empty .e{font-size:28px;display:block;margin-bottom:8px}
.empty p{font-size:13.5px;max-width:34ch;margin:0 auto}

/* ------------------------------ Toast ------------------------------ */
#toast{
  position:fixed;left:50%;bottom:calc(var(--panelH, 120px) + 18px);z-index:1200;
  transform:translate(-50%,12px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  background:var(--ink);color:var(--sand);padding:10px 16px;border-radius:11px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow);max-width:min(90vw,380px);text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:760px){
  #sheet{left:auto;right:16px;bottom:16px;width:400px;border-radius:20px;max-height:min(720px,86dvh)}
  #popup{left:auto;right:10px;width:330px}
}
</style>
</head>
<body>
<!-- ====================== Écran d'accès (provisoire) ===================== -->
<section id="gate" hidden>
  <div class="gate-box">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 14.2c-2.6 0-5.4 1.8-5.4 4.1 0 1.6 1.4 2.4 3 2.4.9 0 1.7-.3 2.4-.3s1.5.3 2.4.3c1.6 0 3-.8 3-2.4 0-2.3-2.8-4.1-5.4-4.1Z"/><ellipse cx="6.2" cy="11" rx="2.1" ry="2.7"/><ellipse cx="17.8" cy="11" rx="2.1" ry="2.7"/><ellipse cx="9.6" cy="6.3" rx="1.9" ry="2.5"/><ellipse cx="14.4" cy="6.3" rx="1.9" ry="2.5"/></svg>
    </div>
    <h1>Leadwood Tracker</h1>
    <p class="sub">Accès réservé à l'équipe de la réserve</p>
    <input class="inp" type="password" id="gatePass" placeholder="Mot de passe" autocomplete="current-password" autocapitalize="off" spellcheck="false">
    <p class="err" id="gateErr" hidden>Mot de passe incorrect.</p>
    <button class="btn" id="gateGo">Entrer</button>
  </div>
</section>

<!-- =========================== Connexion ============================ -->
<section id="login" hidden>
  <div class="gate-box">
    <div class="mark" aria-hidden="true">

<script>
/* =================================================================== *
 *  Leadwood Tracker — logique
 *  Les signalements restent sur l'appareil ; la carte est vectorielle
 *  (reserve.js, tiré des KMZ de la réserve) sur fond satellite.
 * =================================================================== */
(function () {
"use strict";


/* =================================================================== *
 *  Écran d'accès — MESURE PROVISOIRE
 *
 *  Ce contrôle s'exécute dans le navigateur : le code de cette page est
 *  téléchargé par quiconque ouvre l'URL, et le mot de passe peut donc
 *  être contourné en lisant la source. Il écarte le passant qui tombe
 *  sur l'adresse ; il NE PROTÈGE PAS les données.
 *
 *  La protection réelle viendra de l'authentification Supabase : tant
 *  qu'elle n'est pas en place, considérez les signalements comme
 *  accessibles à qui détient la clé de partage.
 *
 *  Changer le mot de passe : ouvrir motdepasse.html sur ce même site,
 *  taper le mot de passe voulu, et recopier la ligne obtenue dans
 *  config.js. Une empreinte vide y désactive complètement cet écran.
 * =================================================================== */
const GATE_SALT = "leadwood:";
// L'empreinte vit dans config.js, pour pouvoir changer le mot de passe sans
// toucher à ce fichier. Absente, l'écran n'est tout simplement pas affiché.
const GATE_HASH = (typeof window.LW_GATE_HASH === "string") ? window.LW_GATE_HASH : "";
const K_GATE = "lw.gate.v1";

async function sha256(txt) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
function gate() {
  if (!GATE_HASH) return Promise.resolve();
  try { if (localStorage.getItem(K_GATE) === GATE_HASH) return Promise.resolve(); } catch (e) {}
  const box = document.getElementById("gate");
  box.hidden = false;
  setTimeout(() => document.getElementById("gatePass").focus(), 120);
  return new Promise((resolve) => {
    const tryPass = async () => {
      const input = document.getElementById("gatePass");
      let ok = false;
      try { ok = (await sha256(GATE_SALT + input.value)) === GATE_HASH; } catch (e) {}
      if (ok) {
        try { localStorage.setItem(K_GATE, GATE_HASH); } catch (e) {}
        box.hidden = true;
        resolve();
      } else {
        document.getElementById("gateErr").hidden = false;
        input.value = ""; input.focus();
      }
    };
    document.getElementById("gateGo").addEventListener("click", tryPass);
    document.getElementById("gatePass").addEventListener("keydown", (e) => {
      if (e.key === "Enter") tryPass();
    });
  });
}

/* ---------------------------- Référentiel --------------------------- */
const ANIMALS = [
  { id:"lion",      nom:"Lion",       e:"🦁", c:"#C8842B" },
  { id:"leopard",   nom:"Léopard",    e:"🐆", c:"#B4553A" },
  { id:"elephant",  nom:"Éléphant",   e:"🐘", c:"#6E7A80" },
  { id:"rhino",     nom:"Rhinocéros", e:"🦏", c:"#5F6A6A" },
  { id:"buffle",    nom:"Buffle",     e:"🐃", c:"#4E4438" },
  { id:"guepard",   nom:"Guépard",    e:"🐅", c:"#D9A13B" },
  { id:"girafe",    nom:"Girafe",     e:"🦒", c:"#C99A45" },
  { id:"zebre",     nom:"Zèbre",      e:"🦓", c:"#6B7280" },
  { id:"hippo",     nom:"Hippo",      e:"🦛", c:"#7C6A86" },
  { id:"crocodile", nom:"Crocodile",  e:"🐊", c:"#4C7A3C" },
  { id:"gnou",      nom:"Gnou",       e:"🐂", c:"#5A5348" },
  { id:"impala",    nom:"Impala",     e:"🦌", c:"#A9762F" },
  { id:"koudou",    nom:"Koudou",     e:"🫎", c:"#8A6A3E" },
  { id:"hyene",     nom:"Hyène",      e:"🐺", c:"#7A6E55" },
  { id:"lycaon",    nom:"Lycaon",     e:"🐕", c:"#9B6B3A" },
  { id:"babouin",   nom:"Babouin",    e:"🐒", c:"#6F5B43" },
  { id:"oiseau",    nom:"Oiseau",     e:"🦅", c:"#4F6470" },
  { id:"autre",     nom:"Autre",      e:"🐾", c:"#1D9E75" }
];
const A = Object.fromEntries(ANIMALS.map(a => [a.id, a]));

// Emprise de secours, si reserve.js manquait : la zone de Leadwood.
const DEFAULT_BOUNDS = { maxLat:-24.371180, minLng:30.900230, minLat:-24.470152, maxLng:30.995868 };

/* ------------------------------ Stockage ---------------------------- */
const K_SIGHT = "lw.sightings.v1";
const K_PREFS = "lw.prefs.v1";

function lsGet(k, d) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : d; } catch (e) { return d; } }
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch (e) { toast("Mémoire pleine : exportez puis effacez d'anciens signalements."); return false; }
}

let sightings = lsGet(K_SIGHT, []);
let prefs = lsGet(K_PREFS, { theme:"auto" });
if (!prefs.fond) prefs.fond = "sat";

// L'ancienne carte PDF (jusqu'à 25 Mo) était copiée dans IndexedDB : on
// libère cette place sur les téléphones déjà équipés.
try { indexedDB.deleteDatabase("leadwood"); } catch (e) {}

/* -------------------------------- État ------------------------------ */
const S = {
  rendered:false, rb:null, renderer:null,
  pos:null, acc:null, gps:"searching",
  animal:null, follow:true,
  placing:false, selected:null
};
let watchId = null;

const $ = (id) => document.getElementById(id);

/* ------------------------------- Géo -------------------------------- */
function distance(a1, o1, a2, o2) {           // haversine, en mètres
  const R = 6371000, r = Math.PI / 180;
  const dLat = (a2 - a1) * r, dLng = (o2 - o1) * r;
  const s = Math.sin(dLat/2)**2 + Math.cos(a1*r) * Math.cos(a2*r) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function bearing(a1, o1, a2, o2) {
  const r = Math.PI / 180;
  const y = Math.sin((o2-o1)*r) * Math.cos(a2*r);
  const x = Math.cos(a1*r)*Math.sin(a2*r) - Math.sin(a1*r)*Math.cos(a2*r)*Math.cos((o2-o1)*r);
  const d = (Math.atan2(y, x) / r + 360) % 360;
  return ["N","NE","E","SE","S","SO","O","NO"][Math.round(d / 45) % 8];
}

/* ------------------------- Données de la réserve -------------------- */
/* reserve.js est généré à partir des fichiers KMZ de la réserve (limite
   de Rietspruit, routes de Leadwood, Bloubank et Khaya Ndlovu) par
   outils/kmz2js.py. Les coordonnées y sont réelles : plus aucun calage. */
const RES = window.LW_RESERVE || { limite:[], lignes:[], noms:[] };
const Z_NOMS = 15;                    // noms des routes à partir de ce zoom

function pointDansAnneau(lat, lng, ring) {
  let dedans = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [ai, oi] = ring[i], [aj, oj] = ring[j];
    if (((ai > lat) !== (aj > lat)) && (lng < (oj - oi) * (lat - ai) / (aj - ai) + oi)) dedans = !dedans;
  }
  return dedans;
}
// Dans la réserve, avec ~130 m de tolérance : un GPS qui flotte le long
// de la clôture ne doit pas faire basculer l'app en « hors réserve ».
function inReserve(lat, lng) {
  if (!RES.limite.length) {
    const B = DEFAULT_BOUNDS;
    return lat <= B.maxLat && lat >= B.minLat && lng >= B.minLng && lng <= B.maxLng;
  }
  const t = 0.0012;
  return [[0,0],[t,0],[-t,0],[0,t],[0,-t]].some(([dl, dg]) =>
    RES.limite.some(r => pointDansAnneau(lat + dl, lng + dg, r)));
}
function reserveBounds() {
  const pts = RES.limite.length ? RES.limite.flat() : RES.lignes.flatMap(l => l.p);
  if (!pts.length) {
    const B = DEFAULT_BOUNDS;
    return L.latLngBounds([[B.minLat, B.minLng], [B.maxLat, B.maxLng]]);
  }
  return L.latLngBounds(pts);
}

/* ------------------------------ La carte ---------------------------- */
let map = null, fondSat = null, reserveLayer = null, nomsLayer = null, markerLayer = null;
let gpsDot = null, gpsAcc = null;

// Fond satellite : imagerie mondiale Esri, sans clé. Les tuiles consultées
// sont gardées par le service worker pour les sorties hors réseau.
const SAT_URL = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";

function isDark() {
  const t = prefs.theme || "auto";
  return t === "dark" || (t === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
}
function styles() {
  if (prefs.fond === "sat") return {
    casing:   { color:"#1A1408", weight:6, opacity:.45 },
    route:    { color:"#FFE7A3", weight:3, opacity:.95 },
    piste:    { color:"#FFFFFF", weight:2, opacity:.85, dashArray:"6 5" },
    interdit: { color:"#FF4D3D", weight:2.6, opacity:.95, dashArray:"2 6" },
    limite:   { color:"#FFB020", weight:3.5, opacity:1, fill:false }
  };
  const d = isDark();
  return {
    casing:   null,
    route:    { color:d ? "#D9A86C" : "#8C5A2B", weight:3, opacity:.95 },
    piste:    { color:d ? "#C9A57A" : "#8C5A2B", weight:1.8, opacity:.8, dashArray:"5 4" },
    interdit: { color:d ? "#FF6F5E" : "#C0392B", weight:2.4, opacity:.95, dashArray:"2 5" },
    limite:   { color:"#1D9E75", weight:3, opacity:1, fill:true, fillColor:"#1D9E75", fillOpacity:.06 }
  };
}
const CLASSES = { route:"Route", piste:"Piste (2-track)", interdit:"No entry for Traverse" };

function drawReserve() {
  if (!map) return;
  if (reserveLayer) map.removeLayer(reserveLayer);
  const st = styles(), rnd = S.renderer;
  const g = L.layerGroup();
  RES.limite.forEach(r => L.polygon(r, Object.assign({ renderer:rnd, interactive:false }, st.limite)).addTo(g));
  if (st.casing) RES.lignes.filter(l => l.c === "route").forEach(l =>
    L.polyline(l.p, Object.assign({ renderer:rnd, interactive:false }, st.casing)).addTo(g));
  ["piste", "route", "interdit"].forEach(c => RES.lignes.filter(l => l.c === c).forEach(l => {
    const pl = L.polyline(l.p, Object.assign({ renderer:rnd }, st[c] || st.route));
    // Toucher une route donne son nom : utile pour annoncer un animal à la radio.
    pl.on("click", (e) => {
      L.DomEvent.stopPropagation(e);
      toast((c === "interdit" ? "⛔ " : "") + (l.n || "Route sans nom") + " · " + CLASSES[c] + (l.z ? " · " + l.z : ""));
    });
    pl.addTo(g);
  }));
  reserveLayer = g.addTo(map);
  if (markerLayer) { markerLayer.remove(); markerLayer.addTo(map); }   // repères au-dessus
}

function buildNoms() {
  nomsLayer = L.layerGroup();
  RES.noms.forEach(([lat, lng, nom, t]) => {
    if (!nom) return;
    L.marker([lat, lng], {
      icon:L.divIcon({ className:"lbl" + (t === "eau" ? " eau" : ""), html:"<span>" + esc(nom) + "</span>", iconSize:[0, 0] }),
      interactive:false, keyboard:false
    }).addTo(nomsLayer);
  });
}
function majNoms() {
  if (!map || !nomsLayer) return;
  const voir = map.getZoom() >= Z_NOMS;
  if (voir && !map.hasLayer(nomsLayer)) nomsLayer.addTo(map);
  else if (!voir && map.hasLayer(nomsLayer)) map.removeLayer(nomsLayer);
}

function setFond(f) {
  prefs.fond = f === "plan" ? "plan" : "sat";
  lsSet(K_PREFS, prefs);
  if (!map) return;
  if (prefs.fond === "sat") { if (!map.hasLayer(fondSat)) fondSat.addTo(map); }
  else if (map.hasLayer(fondSat)) map.removeLayer(fondSat);
  $("map").classList.toggle("plan", prefs.fond !== "sat");
  $("btnFond").classList.toggle("on", prefs.fond === "plan");
  drawReserve();
}

function initMap() {
  S.rb = reserveBounds();
  // Rendu canvas : ~300 tracés restent fluides même sur un vieux téléphone,
  // et la tolérance élargit la zone de toucher d'une route.
  S.renderer = L.canvas({ padding:0.5, tolerance:10 });
  map = L.map("map", {
    zoomControl:false, attributionControl:true, renderer:S.renderer,
    maxBounds:S.rb.pad(0.6), maxBoundsViscosity:0.8,
    minZoom:11, maxZoom:19, zoomSnap:0.25, wheelPxPerZoomLevel:90
  });
  map.attributionControl.setPrefix(false);
  L.control.scale({ imperial:false, position:"bottomleft", maxWidth:110 }).addTo(map);
  fondSat = L.tileLayer(SAT_URL, {
    maxNativeZoom:17, maxZoom:19, crossOrigin:"anonymous", keepBuffer:3,
    attribution:"Imagerie © Esri, Maxar, Earthstar Geographics"
  });
  map.fitBounds(S.rb, { padding:[12, 12] });
  markerLayer = L.layerGroup().addTo(map);
  buildNoms();
  setFond(prefs.fond);
  majNoms();

  map.on("dragstart", () => setFollow(false));
  map.on("zoomend", () => { majNoms(); drawOverlay(); });
  map.on("click", () => { if (!S.placing) closePopup(); });
  // Appui long sur la carte : signaler l'animal choisi à cet endroit.
  map.on("contextmenu", (e) => { if (S.animal && !S.placing) startPlacing(e.latlng); });
  S.rendered = true;
}

function enterMap() {
  if (S.rendered) return;
  $("screen").hidden = false;
  buildGrid();
  initMap();
  drawOverlay();
  startGPS();
}

function centerOn(lat, lng, z) {
  if (!map) return;
  map.setView([lat, lng], Math.max(map.getZoom(), z || 16));
}

$("btnZoomIn").addEventListener("click", () => map && map.zoomIn(1));
$("btnZoomOut").addEventListener("click", () => map && map.zoomOut(1));
$("btnFit").addEventListener("click", () => { setFollow(false); map && map.fitBounds(S.rb, { padding:[12, 12] }); });
$("btnFond").addEventListener("click", () => {
  setFond(prefs.fond === "sat" ? "plan" : "sat");
  toast(prefs.fond === "sat" ? "Fond satellite" : "Plan des routes — fonctionne sans réseau");
});
$("btnFollow").addEventListener("click", () => {
  if (!S.pos) { toast("Position GPS pas encore disponible."); return; }
  setFollow(!S.follow);
  if (S.follow) centerOn(S.pos.lat, S.pos.lng, 16);
});
function setFollow(v) { S.follow = v; $("btnFollow").classList.toggle("on", v); }

window.addEventListener("resize", () => {
  syncPanelHeight();
  if (map) map.invalidateSize();
});

/* --------------------------- Géolocalisation ------------------------ */
function startGPS() {
  if (!navigator.geolocation) { setGps("error"); return; }
  watchId = navigator.geolocation.watchPosition(
    (p) => {
      S.pos = { lat:p.coords.latitude, lng:p.coords.longitude };
      S.acc = p.coords.accuracy;
      const premier = !S.pos0; S.pos0 = true;
      setGps(inReserve(S.pos.lat, S.pos.lng) ? "ok" : "out");
      if (S.follow && S.gps === "ok") {
        if (premier) centerOn(S.pos.lat, S.pos.lng, 15);
        else map.panTo([S.pos.lat, S.pos.lng], { animate:true });
      }
      drawGps();
    },
    (err) => setGps(err.code === 1 ? "denied" : "error"),
    { enableHighAccuracy:true, maximumAge:5000, timeout:20000 }
  );
  setFollow(true);
}
function setGps(s) {
  S.gps = s;
  const el = $("gps");
  const map = {
    ok:       ["ok",        "GPS actif"],
    searching:["searching", "GPS…"],
    out:      ["out",       "Hors réserve"],
    error:    ["error",     "GPS perdu"],
    denied:   ["error",     "GPS refusé"]
  }[s] || ["error", s];
  el.className = "badge " + map[0];
  el.innerHTML = '<span class="led"></span>' + map[1];
  updateReport(); drawGps();
}

/* ------------------------------ Signalements ------------------------ */
/* Durée d'affichage d'un repère : réglée une fois pour toute l'équipe dans
   config.js (LW_DUREE_H). Si chaque téléphone avait la sienne, deux
   véhicules ne verraient pas la même carte au même moment. */
function dureeH() {
  const d = window.LW_DUREE_H;
  return (typeof d === "number" && d >= 0) ? d : 5;
}
function expiryMs() { const h = dureeH(); return h ? h * 3600e3 : Infinity; }
function isLive(s) { return !s.deleted && (Date.now() - new Date(s.ts).getTime()) < expiryMs(); }
function live() { return sightings.filter(isLive); }
function known() { return sightings.filter(s => !s.deleted); }

function syncPanelHeight() {
  const h = $("panel").offsetHeight;
  if (h) document.documentElement.style.setProperty("--panelH", h + "px");
}
function buildGrid() {
  const g = $("grid");
  g.innerHTML = "";
  ANIMALS.forEach(a => {
    const btn = document.createElement("button");
    btn.className = "an"; btn.type = "button";
    btn.style.setProperty("--c", a.c);
    btn.dataset.id = a.id;
    btn.setAttribute("aria-pressed", "false");
    btn.innerHTML = `<span class="e">${a.e}</span><span class="n">${a.nom}</span>`;

}
function pick(id) {
  S.animal = S.animal === id ? null : id;
  $("grid").querySelectorAll(".an").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === S.animal)));
  updateReport();
}
function updateReport() {
  const b2 = $("reportBtn");
  if (!S.animal) { b2.textContent = "Sélectionnez un animal"; b2.disabled = true; return; }
  const a = A[S.animal];
  if (S.gps === "ok") { b2.textContent = `Signaler ${a.e} ${a.nom} ici`; b2.disabled = false; }
  else if (S.gps === "out") { b2.textContent = "Hors réserve — placer à la main"; b2.disabled = false; }

}

function addSighting(lat, lng, acc) {
  const now = new Date().toISOString();
  const rec = {
    id: uid(), animal:S.animal, ts:now,
    lat:+lat.toFixed(6), lng:+lng.toFixed(6), acc:acc ? Math.round(acc) : null,
    author:myName(), author_id:(me() && me().id) || null,
    deleted:false, upd:now, sync:"pending"
  };
  sightings.unshift(rec);
  lsSet(K_SIGHT, sightings);
  const a = A[rec.animal];
  toast(`${a.e} ${a.nom} signalé${syncOn() ? " · envoyé aux autres véhicules" : (dureeH() ? " · visible " + dureeH() + " h" : "")}`);
  drawOverlay(); updateCount(); setSync();
  if (syncOn()) syncCycle(true);
}
function removeSighting(id) {
  const i = sightings.findIndex(s => s.id === id);
  if (i < 0) return;
  if (syncOn()) {
    // Suppression logique : sans elle, le repère reviendrait à la relève suivante.
    sightings[i] = Object.assign({}, sightings[i], {
      deleted:true, upd:new Date().toISOString(), sync:"pending"
    });
  } else {
    sightings.splice(i, 1);
  }
  lsSet(K_SIGHT, sightings);
  closePopup(); drawOverlay(); updateCount(); setSync();
  if (syncOn()) syncCycle(true);
  if (sheetMode === "hist") openHist();
}
function updateCount() {
  const n = live().length, el = $("liveCount");

/* ------------------------------ Overlay ----------------------------- */
function pinSvg(an) {
  return `<svg width="46" height="46" viewBox="-23 -40 46 46" aria-hidden="true">
    <path d="M0 2 L-13 -14 A17 17 0 1 1 13 -14 Z" fill="${an.c}" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="-17" r="13.5" fill="${an.c}" stroke="#fff" stroke-width="2.5"/>
    <text x="0" y="-12" text-anchor="middle" font-size="15">${an.e}</text></svg>`;
}
function drawOverlay() {
  if (!map) return;
  markerLayer.clearLayers();
  const now = Date.now(), exp = expiryMs();
  const vis = live().map(s => ({ s, pt:map.latLngToLayerPoint([s.lat, s.lng]) }));
  // Deux animaux signalés au même endroit : on les écarte en éventail,
  // sinon le dernier repère masque complètement les précédents.
  const buckets = new Map();
  vis.forEach(v => {
    const key = Math.round(v.pt.x / 20) + "," + Math.round(v.pt.y / 20);
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(v);
  });
  buckets.forEach(group => {
    if (group.length < 2) return;
    const r = 15 + group.length * 1.5;
    group.forEach((v, i) => {
      const ang = (i / group.length) * Math.PI * 2 - Math.PI / 2;
      v.pt = L.point(v.pt.x + Math.cos(ang) * r, v.pt.y + Math.sin(ang) * r);
    });
  });
  vis.forEach(({ s, pt }) => {
    const an = A[s.animal] || A.autre;
    const age = now - new Date(s.ts).getTime();
    const fade = exp === Infinity ? 1 : Math.max(.35, 1 - (age / exp) * .65);
    const m = L.marker(map.layerPointToLatLng(pt), {
      icon:L.divIcon({ className:"pin", html:pinSvg(an), iconSize:[46, 46], iconAnchor:[23, 40] }),
      opacity:fade, keyboard:false, zIndexOffset:Math.round(new Date(s.ts).getTime() / 1000 % 1e6)
    });
    m.on("click", () => openPopup(s.id));
    m.on("add", () => { const el = m.getElement(); if (el) el.dataset.id = s.id; });
    m.addTo(markerLayer);
  });
  drawGps();
}

// Position de l'observateur : point bleu + cercle de précision (en mètres réels).
function drawGps() {
  if (!map) return;
  if (!S.pos) {
    if (gpsDot) { gpsDot.remove(); gpsAcc.remove(); gpsDot = gpsAcc = null; }
    return;
  }
  const ll = [S.pos.lat, S.pos.lng], r = Math.min(S.acc || 0, 500);
  if (!gpsDot) {
    gpsAcc = L.circle(ll, { radius:r, color:"#378ADD", weight:1, opacity:.45, fillOpacity:.12, interactive:false }).addTo(map);
    gpsDot = L.marker(ll, {
      icon:L.divIcon({ className:"me", html:'<i class="halo"></i><i class="dot"></i>', iconSize:[34, 34], iconAnchor:[17, 17] }),
      interactive:false, keyboard:false, zIndexOffset:-1000
    }).addTo(map);
  } else { gpsDot.setLatLng(ll); gpsAcc.setLatLng(ll); gpsAcc.setRadius(r); }
}

(function dragSheet() {
  const g = $("grip"); let y0 = null;
  const dn = (e) => { y0 = (e.touches ? e.touches[0] : e).clientY; sheet.style.transition = "none"; };
  const mv = (e) => {
    if (y0 === null) return;
    const dy = Math.max(0, (e.touches ? e.touches[0] : e).clientY - y0);
    sheet.style.transform = `translateY(${dy}px)`;
  };
  const upp = () => {
    if (y0 === null) return;
    const dy = parseFloat((sheet.style.transform.match(/([\d.]+)px/) || [0,0])[1]) || 0;
    sheet.style.transition = ""; sheet.style.transform = ""; y0 = null;
    if (dy > 90) closeSheet();
  };
  g.addEventListener("touchstart", dn, { passive:true });
  g.addEventListener("touchmove", mv, { passive:true });
  g.addEventListener("touchend", upp);
  g.addEventListener("mousedown", dn);
  window.addEventListener("mousemove", mv);
  window.addEventListener("mouseup", upp);
})();

      const add = inc.filter(s => s && s.lat != null && s.lng != null && !known.has(s.id));

/* =================================================================== *
 *  Partage entre véhicules
 *
 *  Hors ligne d'abord : l'appareil reste maître de ses données. Ce qui
 *  n'est pas encore parti attend dans la file et repart au retour du
 *  réseau. La relève se fait par sondage (12 s) plutôt que par
 *  WebSocket : en brousse, une connexion permanente tombe sans arrêt.
 * =================================================================== */
const K_SYNC = "lw.sync.v1", K_CURSOR = "lw.sync.cursor", K_SESSION = "lw.session.v1";
let sync = lsGet(K_SYNC, null);          // { url, key, author, auth }
let cursor = lsGet(K_CURSOR, null);
let session = lsGet(K_SESSION, null);    // { access_token, refresh_token, expires_at, user }
let syncTimer = null, syncing = false, lastErr = null;

function syncOn() { return !!(sync && sync.url && sync.key); }
function base() { return sync.url.replace(/\/+$/, ""); }
function api(path) { return base() + "/rest/v1/" + path; }

/* ------------------------------ Comptes ----------------------------- */
function loggedIn() { return !!(session && session.access_token); }
function me() { return (session && session.user) || null; }
function myName() {
  const u = me();
  if (!u) return (sync && sync.author) || null;
  // Le nom vient d'abord du compte, sinon du véhicule choisi à la connexion
  // (config.js), et en dernier recours de l'adresse du compte.
  return (u.user_metadata && u.user_metadata.vehicule)
      || vehiculeDuCompte(u.email)
      || u.email || null;
}
function vehiculeDuCompte(email) {
  const v = vehicules().find(x => x.email === email);
  return v ? v.nom : null;
}

/* Un guide n'a pas à toucher au calage, à la carte, ni aux exports : une
   fausse manœuvre en pleine sortie décalerait les repères de tout le monde,
   et un export CSV des positions n'a rien à faire sur son téléphone.
   Les comptes administrateurs sont désignés dans config.js (admin: true),
   ou par la métadonnée « admin » du compte Supabase.
   Sans comptes du tout, l'appareil est seul maître : tout est accessible. */
function isAdmin() {
  if (!authRequired()) return true;
  const u = me();
  if (!u) return false;
  if (u.user_metadata && u.user_metadata.admin === true) return true;
  const v = vehicules().find(x => x.email === u.email);
  return !!(v && v.admin === true);
}
function authRequired() { return !!(sync && sync.auth); }

function setSession(d) {
  session = {
    access_token:d.access_token,
    refresh_token:d.refresh_token,
    expires_at:d.expires_at || (Math.floor(Date.now() / 1000) + (d.expires_in || 3600)),
    user:d.user || (session && session.user) || null
  };
  lsSet(K_SESSION, session);
}
function signOut(silent) {
  session = null; lsSet(K_SESSION, null);
  if (!silent) toast("Déconnecté.");
  setSync();
  if (authRequired()) showLogin();
}

// Le jeton d'accès est court (une heure) : on le renouvelle avant qu'il
// n'expire. Un échec réseau ne déconnecte pas — on réessaiera plus tard ;
// seul un refus explicite du serveur invalide la session.
let refreshing = null;

async function ensureToken() {
  if (!loggedIn()) return null;
  const now = Math.floor(Date.now() / 1000);
  if (session.expires_at && session.expires_at - 60 > now) return session.access_token;
  if (!session.refresh_token) { signOut(true); return null; }

  // Un seul rafraîchissement à la fois. Supabase invalide le jeton de
  // rafraîchissement dès qu'il a servi : deux appels simultanés — cas
  // courant, l'envoi et la relève partant ensemble — se détruiraient
  // mutuellement et déconnecteraient le guide sans raison apparente.
  if (!refreshing) {
    refreshing = (async () => {
      try {
        const r = await fetch(base() + "/auth/v1/token?grant_type=refresh_token", {
          method:"POST",
          headers:{ apikey:sync.key, "Content-Type":"application/json" },
          body:JSON.stringify({ refresh_token:session.refresh_token })
        });
        if (r.status >= 400 && r.status < 500) { signOut(true); return null; }
        if (!r.ok) return null;
        setSession(await r.json());
        return session.access_token;
      } catch (e) {
        return null;                     // hors ligne : on garde la session
      } finally {
        refreshing = null;
      }
    })();
  }
  return refreshing;
}

async function signIn(email, password) {
  const r = await fetch(base() + "/auth/v1/token?grant_type=password", {
    method:"POST",
    headers:{ apikey:sync.key, "Content-Type":"application/json" },
    body:JSON.stringify({ email:email.trim().toLowerCase(), password })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    const msg = (d.error_description || d.msg || d.message || "").toLowerCase();
    if (msg.indexOf("credential") >= 0 || msg.indexOf("invalid") >= 0) {
      throw new Error("Identifiant ou mot de passe incorrect.");
    }
    if (msg.indexOf("confirm") >= 0) {
      throw new Error("Ce compte n'est pas confirmé. Validez-le depuis le tableau de bord Supabase.");
    }
    throw new Error("Connexion refusée par le serveur.");
  }
  setSession(d);
  return session;
}

async function heads(extra) {
  const h = { "apikey": sync.key, "Content-Type": "application/json" };
  const tok = await ensureToken();
  if (tok) h["Authorization"] = "Bearer " + tok;
  // Sans compte, on retombe sur la clé partagée. Les clés historiques sont
  // des JWT (« eyJ… ») et passent en Bearer ; les nouvelles clés
  // « publishable » n'en sont pas et ne doivent pas y être mises.
  else if (/^eyJ/.test(sync.key)) h["Authorization"] = "Bearer " + sync.key;
  return Object.assign(h, extra || {});
}

function toRemote(s) {
  const r = {
    id:s.id, animal:s.animal, ts:s.ts, lat:s.lat, lng:s.lng,
    acc:s.acc == null ? null : s.acc, author:s.author || null,
    deleted:!!s.deleted, updated_at:s.upd || s.ts
  };
  if (s.author_id) r.author_id = s.author_id;
  return r;
}
function fromRemote(r) {
  return {
    id:r.id, animal:r.animal, ts:r.ts, lat:+r.lat, lng:+r.lng,
    acc:r.acc == null ? null : +r.acc, author:r.author || null,
    author_id:r.author_id || null,
    deleted:!!r.deleted, upd:r.updated_at || r.ts, sync:"ok"
  };
}
// Un signalement d'un autre véhicule ne peut pas être modifié : la
// politique RLS le refuserait et bloquerait toute la file d'envoi.
function mine(s) {
  if (!authRequired()) return true;
  if (!s.author_id) return true;
  return !!(me() && s.author_id === me().id);
}

async function syncTest(url, key) {
  const u = url.replace(/\/+$/, "") + "/rest/v1/sightings?select=id&limit=1";
  const hh = { apikey:key };
  if (/^eyJ/.test(key)) hh.Authorization = "Bearer " + key;
  const res = await fetch(u, { headers:hh });
  if (res.status === 200) return { ok:true, auth:false };
  if (res.status === 404) return { ok:false, msg:"Table « sightings » introuvable : exécutez le script SQL dans Supabase." };

  // Accès refusé à la clé seule : c'est le mode sécurisé, pas une panne.
  // PostgREST répond 401 ou 403 selon les cas (« permission denied »,
  // code 42501, ou absence de jeton) ; on ne fait pas la différence, on
  // écarte seulement le cas d'une clé réellement invalide.
  if (res.status === 401 || res.status === 403) {
    const body = await res.text().catch(() => "");
    if (/invalid api key|invalid_api_key|no api key/i.test(body)) {
      return { ok:false, msg:"Clé refusée par Supabase : vérifiez la clé « anon public »." };
    }
    return { ok:true, auth:true };
  }
  return { ok:false, msg:"Réponse inattendue du serveur (" + res.status + ")." };
}

async function syncCycle(force) {
  if (!syncOn() || syncing) return;
  if (authRequired() && !loggedIn()) { setSync(); return; }
  if (!navigator.onLine && !force) { setSync(); return; }
  syncing = true;
  try {
    // 1. envoyer ce qui attend
    const out = sightings.filter(s => s.sync !== "ok" && s.sync !== "refuse").map(toRemote);
    if (out.length) {
      const res = await fetch(api("sightings"), {
        method:"POST",
        headers:await heads({ "Prefer":"resolution=merge-duplicates,missing=default,return=minimal" }),
        body:JSON.stringify(out)
      });
      if (res.status === 401) return needLogin();
      if (res.status === 403) {
        const body = await res.text().catch(() => "");
        // Une ligne refusée par la sécurité au niveau des lignes n'est pas
        // un problème de session : la remettre en file bloquerait tout le
        // reste indéfiniment. On l'écarte et on prévient une fois.
        if (/row-level security|violates/i.test(body)) {
          const ids = new Set(out.map(o => o.id));
          sightings.forEach(s => { if (ids.has(s.id)) s.sync = "refuse"; });
          lsSet(K_SIGHT, sightings);
          toast("Un signalement n'a pas pu être partagé : il appartient à un autre véhicule.");
          return;
        }
        return needLogin();
      }
      if (!res.ok) throw new Error("envoi " + res.status + " " + (await res.text()).slice(0, 120));
      const sent = new Set(out.map(o => o.id));
      sightings.forEach(s => { if (sent.has(s.id)) s.sync = "ok"; });
      lsSet(K_SIGHT, sightings);
    }

    // 2. relever ce que les autres ont posté
    const since = cursor || new Date(Date.now() - 7 * 864e5).toISOString();
    const q = "sightings?select=*&updated_at=gt." + encodeURIComponent(since)
            + "&order=updated_at.asc&limit=500";
    const res2 = await fetch(api(q), { headers:await heads() });
    if (res2.status === 401 || res2.status === 403) return needLogin();
    if (!res2.ok) throw new Error("relève " + res2.status);
    const rows = await res2.json();
    let changed = false;
    rows.forEach(r => {
      const inc = fromRemote(r);
      const i = sightings.findIndex(s => s.id === inc.id);
      if (i < 0) { sightings.push(inc); changed = true; }
      else if (new Date(inc.upd) > new Date(sightings[i].upd || sightings[i].ts)) {
        sightings[i] = inc; changed = true;
      }
      if (!cursor || new Date(inc.upd) > new Date(cursor)) cursor = inc.upd;
    });
    if (rows.length) { lsSet(K_CURSOR, cursor); }
    if (changed) {
      purgeTombstones();
      lsSet(K_SIGHT, sightings);
      drawOverlay(); updateCount();
      if (sheetMode === "hist") openHist();
    }
    lastErr = null;
  } catch (e) {
    lastErr = String(e.message || e);
  } finally {
    syncing = false;
    setSync();
  }
}

function purgeTombstones() {                 // les suppressions n'ont plus à voyager après 7 jours
  const cut = Date.now() - 7 * 864e5;
  sightings = sightings.filter(s => !(s.deleted && new Date(s.upd || s.ts).getTime() < cut));
}

function setSync() {
  const el = $("sync");
  if (!el) return;
  const wait = sightings.filter(s => s.sync !== "ok" && s.sync !== "refuse").length;
  let cls = "local", txt = "Local";
  if (syncOn()) {
    if (authRequired() && !loggedIn()) { cls = "error"; txt = "Connexion requise"; }
    else if (!navigator.onLine) { cls = "wait"; txt = wait ? wait + " en attente" : "Hors ligne"; }
    else if (wait) { cls = "wait"; txt = wait + " en attente"; }
    else if (lastErr) { cls = "error"; txt = "Partage en erreur"; }
    else { cls = "ok"; txt = "Partagé"; }
  }
  el.className = "badge " + cls;
  el.innerHTML = '<span class="led"></span>' + txt;
}

function startSync() {
  clearInterval(syncTimer);
  if (!syncOn()) { setSync(); return; }
  syncCycle(true);
  syncTimer = setInterval(() => { if (!document.hidden) syncCycle(); }, 12000);
}
window.addEventListener("online", () => syncCycle(true));
window.addEventListener("offline", setSync);
document.addEventListener("visibilitychange", () => { if (!document.hidden) syncCycle(true); });

let loginResolve = null;

/* Liste des véhicules déclarée dans config.js. Renseignée, le guide n'a
   qu'un mot de passe à taper : l'adresse du compte est déduite du véhicule
   choisi, et n'apparaît jamais à l'écran. Vide, on retombe sur la saisie
   classique e-mail + mot de passe. */
function vehicules() {
  const v = window.LW_VEHICULES;
  return Array.isArray(v) ? v.filter(x => x && x.nom && x.email) : [];
}
const K_VEH = "lw.vehicule";

function showLogin() {
  const box = $("login");
  if (!box.hidden) return;
  box.hidden = false;
  $("loginErr").hidden = true;
  $("loginSkip").hidden = !!preset();

  const vs = vehicules();
  const sel = $("loginVeh"), mail = $("loginEmail");
  if (vs.length) {
    sel.innerHTML = "";
    vs.forEach((v, i) => {
      const o = document.createElement("option");
      o.value = String(i); o.textContent = v.nom;
      sel.appendChild(o);
    });
    let last = 0;
    try {
      const prev = localStorage.getItem(K_VEH);
      const j = vs.findIndex(v => v.email === prev);
      if (j >= 0) last = j;
    } catch (e) {}
    sel.value = String(last);
    sel.hidden = false; mail.hidden = true;
    $("loginSub").textContent = "Choisissez votre véhicule, puis entrez son mot de passe.";
    setTimeout(() => $("loginPass").focus(), 120);
  } else {
    sel.hidden = true; mail.hidden = false;
    mail.value = (me() && me().email) || "";
    $("loginSub").textContent = "Votre compte guide donne accès aux signalements de l'équipe.";
    setTimeout(() => { $(mail.value ? "loginPass" : "loginEmail").focus(); }, 120);
  }
}
function endLogin(ok) {
  $("login").hidden = true;
  const r = loginResolve; loginResolve = null;
  if (r) r(ok);
}
function waitLogin() {
  showLogin();
  return new Promise((res) => { loginResolve = res; });
}
function needLogin() {
  if (!sync.auth) { sync.auth = true; lsSet(K_SYNC, sync); }
  session = null; lsSet(K_SESSION, null);
  setSync();
  showLogin();
}

(function bindLogin() {
  const go = async () => {
    const btn = $("loginGo");
    const vs = vehicules();
    let email = $("loginEmail").value, nom = null;
    if (vs.length) {
      const v = vs[parseInt($("loginVeh").value, 10)] || vs[0];
      email = v.email; nom = v.nom;
    }
    btn.disabled = true; btn.textContent = "Connexion…";
    try {
      await signIn(email, $("loginPass").value);
      if (nom) { try { localStorage.setItem(K_VEH, email); } catch (e) {} }
      if (!sync.auth) { sync.auth = true; lsSet(K_SYNC, sync); }
      $("loginPass").value = "";
      endLogin(true);
      toast("Connecté — " + (myName() || ""));
      setSync(); startSync();
      enterMap();
    } catch (e) {
      $("loginErr").textContent = e.message;
      $("loginErr").hidden = false;
      $("loginPass").value = "";
    } finally { btn.disabled = false; btn.textContent = "Se connecter"; }
  };
  $("loginGo").addEventListener("click", go);
  $("loginPass").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  // Pas d'échappatoire en un geste : un guide qui contournerait la connexion
  // croirait signaler alors que personne ne recevrait rien. On ne propose
  // que de corriger le projet visé — et la désactivation franche du partage
  // reste disponible dans l'écran qui s'ouvre, pour qui la veut vraiment.
  $("loginSkip").addEventListener("click", () => {
    $("login").hidden = true;
    openSync();
  });
})();

function preset() {

function applyPreset() {
  const c = preset();

    sync = { url:c.url, key:c.key, author:"", auth:true };
    lsSet(K_SYNC, sync);

    sync.auth = true; lsSet(K_SYNC, sync);

}

function applyConfigLink() {
  const m = location.hash.match(/^#c=(.+)$/);
  if (!m) return false;
  try {
    const d = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if (!d.u || !d.k) return false;
    sync = { url:d.u, key:d.k, author:(sync && sync.author) || "" };
    lsSet(K_SYNC, sync);
    history.replaceState(null, "", location.pathname);
    setTimeout(() => toast("Partage configuré. Indiquez le nom de votre véhicule dans les réglages."), 900);
    return true;
  } catch (e) { return false; }
}

/* ------------------------------ Utilitaires ------------------------- */
function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  // Repli pour les anciens iPhone : un UUID v4 valide, sinon la base le refuse
  // et bloque toute la file d'envoi.
  const b = new Uint8Array(16);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(b)
    : b.forEach((_, i) => { b[i] = Math.floor(Math.random() * 256); });
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
  return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20);
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function ago(iso) {
  const d = Date.now() - new Date(iso).getTime();
  if (d < 6e4) return "à l'instant";
  if (d < 36e5) return "il y a " + Math.round(d / 6e4) + " min";
  if (d < 864e5) return "il y a " + Math.round(d / 36e5) + " h";
  return new Date(iso).toLocaleString("fr-BE", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" });
}
function stamp() { return new Date().toISOString().slice(0, 10); }
function dl(name, mime, text) {
  const url = URL.createObjectURL(new Blob([text], { type:mime }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Fichier généré : " + name);
}
let tt;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 3200);
}
function applyTheme() {
  const t = prefs.theme || "auto";
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}

/* -------------------------------- Boot ------------------------------ */
applyTheme();
applyConfigLink();      // lien « #c=… » envoyé par un autre véhicule
applyPreset();          // projet Supabase déclaré dans config.js
updateCount();
setSync();
startSync();

// Rafraîchit l'estompement des repères et les « il y a X min ».
setInterval(() => { if (S.rendered) { drawOverlay(); updateCount(); } }, 60000);

(async function boot() {
  await gate();
  // Comptes exigés par le serveur : pas de carte avant la connexion.
  if (syncOn() && authRequired() && !loggedIn()) await waitLogin();

  enterMap();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
})();
</script>
